<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthAxis Admin</title>
    <base href="/admin/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HealthAxis.Admin.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading-shell">
            <div class="app-loading-card">
                <div class="app-loading-logo">HA</div>
                <div class="app-loading-content">
                    <p class="app-loading-kicker">HealthAxis Admin Console</p>
                    <h1>Preparing your workspace</h1>
                    <p>Loading dashboard resources...</p>
                </div>
                <div class="app-loading-bar" aria-hidden="true">
                    <div class="app-loading-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script src="js/scrollHelpers.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
