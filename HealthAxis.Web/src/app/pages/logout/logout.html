<div class="min-h-screen bg-gradient-to-br from-blue-50 via-slate-50 to-cyan-50 px-5 py-10 text-slate-900">
  <main class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-3xl items-center justify-center">
    <section class="w-full rounded-3xl border border-blue-100 bg-white/90 p-8 text-center shadow-sm backdrop-blur">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-blue-100 text-3xl font-black text-blue-700">
        ✓
      </div>

      <p class="mt-6 text-sm font-bold uppercase tracking-wider text-blue-600">
        Logged out
      </p>

      <h1 class="mt-2 text-4xl font-black tracking-tight text-slate-950">
        You have been signed out
      </h1>

      <p class="mx-auto mt-4 max-w-xl text-sm font-semibold leading-6 text-slate-500">
        Your local session data has been cleared. When API authentication is connected, this page can also call the logout endpoint if the backend requires server-side logout handling.
      </p>

      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <button
          type="button"
          (click)="goToLogin()"
          class="rounded-full bg-blue-600 px-6 py-3 text-sm font-bold text-white shadow-sm hover:bg-blue-700">
          Go to login
        </button>

        <button
          type="button"
          (click)="goToHome()"
          class="rounded-full bg-slate-100 px-6 py-3 text-sm font-bold text-slate-700 hover:bg-slate-200">
          Go home
        </button>
      </div>
    </section>
  </main>
</div>
